services:
  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TZ=America/New_York
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /home/dhruv/jellyfin/config:/config:Z
      - /home/dhruv/jellyfin/cache:/cache:Z
      - /home/dhruv/Videos/Movies:/data/movies:z
      - /home/dhruv/Videos/Shows:/data/tvshows:z
    restart: unless-stopped
