services:
  photoview:
    image: docker.io/viktorstrate/photoview:latest
    container_name: photoview
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8082:8080"
    environment:
      - PHOTOVIEW_DATABASE_DRIVER=sqlite
      - PHOTOVIEW_SQLITE_PATH=/home/photoview/media/photoview.db
      - PHOTOVIEW_LISTEN_IP=0.0.0.0
      - PHOTOVIEW_LISTEN_PORT=8080
      - PHOTOVIEW_MEDIA_CACHE=/home/photoview/media/cache
    volumes:
      - /home/dhruv/homelab/photoview:/home/photoview/media:Z
      - /home/dhruv/Pictures:/storage:ro,z
